name: Deploy to Cloudflare

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare deploy skipped: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID secrets are not set (dry run only)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout gh-pages (read-only)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Stage assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf main/cf-dist
          mkdir main/cf-dist
          cp -a site/. main/cf-dist/
          rm -rf main/cf-dist/.git
          cp main/cloudflare/_headers main/cloudflare/.assetsignore main/cf-dist/
          # Mirror the site under the old GitHub Pages prefix so /running-light-v5/ links keep working.
          mkdir main/cf-dist/running-light-v5
          rsync -a --exclude .git site/ main/cf-dist/running-light-v5/
          find main/cf-dist -type f | sort

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: main
          command: deploy
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Dry run
        if: steps.secrets.outputs.ready != 'true'
        shell: bash
        working-directory: main
        run: npx --yes wrangler@4.156.2 deploy --dry-run
