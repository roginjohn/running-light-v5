<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Running Light – play credits only</title>
  <link rel="icon" href="data:," />
  <meta name="description" content="Running Light: a perya bulb-track game. Play credits only. No real money value." />
</head>
<body>
  <main id="app" aria-label="Running Light">
    <div id="r-frame" aria-hidden="true"></div>
    <div id="r-stage" class="stage" aria-hidden="true"></div>
    <p class="sr-only">Board: 50 display squares, number 1 top-left, clockwise: 30 tier squares and 20 blank squares that pay nothing. Bets go on the six tier spots.</p>
    <div id="r-track" aria-hidden="true"></div>
    <div id="r-centre"></div>
    <div id="r-top"></div>
    <div id="r-controls"></div>
    <div id="r-credits"></div>
    <div id="r-bar"></div>
    <div id="r-toast"></div>
    <div id="r-modal"></div>
    <div id="r-start" class="screen" hidden></div>
    <div id="loading" class="screen" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"></div>
    <div id="rotate" class="screen" hidden><div class="bg"></div><div class="content"><h1>Running Light</h1><p>Turn your phone upright, or make the window bigger, to play Running Light.</p></div></div>
    <div id="fatal" class="screen" hidden><div class="bg"></div><div class="content"><h1>Running Light could not start</h1><p>Please reload the page.</p></div></div>
    <div id="live" class="sr-only" aria-live="polite" role="status"></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
